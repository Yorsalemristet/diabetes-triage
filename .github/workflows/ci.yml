
name: CI - Diabetes Triage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 httpx==0.28.1 ruff

      - name: Lint Python code
        run: |
          ruff check app/ training/ tests/

      - name: Training smoke test
        run: |
          python training/train.py | tee training-results.txt
          test -f models/model.joblib

      - name: Run API tests
        run: |
          python -m pytest tests/ -v

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-training-artifacts
          path: |
            models/model.joblib
            training-results.txt
          if-no-files-found: warn
  